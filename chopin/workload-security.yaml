apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-qemu
handler: kata-qemu
overhead:
  podFixed:
    memory: 1Gi
    cpu: 100m
scheduling:
  nodeSelector:
    homelab/kata: "true"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: require-kata-isolation
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers]
  matchConditions:
    - name: application-namespace
      expression: "!(request.namespace in ['kube-system', 'kube-public', 'kube-node-lease'])"
  variables:
    - name: containers
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : []) + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])"
  validations:
    - expression: "has(object.spec.runtimeClassName) && object.spec.runtimeClassName == 'kata-qemu'"
      message: Application pods must use runtimeClassName kata-qemu.
    - expression: "(!has(object.spec.hostNetwork) || !object.spec.hostNetwork) && (!has(object.spec.hostPID) || !object.spec.hostPID) && (!has(object.spec.hostIPC) || !object.spec.hostIPC)"
      message: Host namespaces are forbidden.
    - expression: "!has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.hostPath))"
      message: Host filesystem mounts are forbidden.
    - expression: "variables.containers.all(c, !has(c.ports) || c.ports.all(p, !has(p.hostPort) || p.hostPort == 0))"
      message: Host ports are forbidden; use Tailscale addresses.
    - expression: "variables.containers.filter(c, c.name != 'tailscale').all(c, !has(c.securityContext) || ((!has(c.securityContext.privileged) || !c.securityContext.privileged) && (!has(c.securityContext.allowPrivilegeEscalation) || !c.securityContext.allowPrivilegeEscalation)))"
      message: Only the administrator-defined Tailscale init sidecar may be privileged.
    - expression: "object.spec.containers.all(c, c.name != 'tailscale') && (!has(object.spec.ephemeralContainers) || object.spec.ephemeralContainers.all(c, c.name != 'tailscale'))"
      message: The tailscale name is reserved for the injected init sidecar.
    - expression: "variables.containers.filter(c, c.name != 'tailscale').all(c, has(c.securityContext) && ((has(c.securityContext.runAsNonRoot) && c.securityContext.runAsNonRoot) || (!has(c.securityContext.runAsNonRoot) && has(object.spec.securityContext) && has(object.spec.securityContext.runAsNonRoot) && object.spec.securityContext.runAsNonRoot)) && has(c.securityContext.allowPrivilegeEscalation) && !c.securityContext.allowPrivilegeEscalation && has(c.securityContext.capabilities) && has(c.securityContext.capabilities.drop) && 'ALL' in c.securityContext.capabilities.drop && (!has(c.securityContext.capabilities.add) || c.securityContext.capabilities.add.all(x, x == 'NET_BIND_SERVICE')))"
      message: Applications must run non-root with no privilege escalation and drop ALL capabilities.
    - expression: "!has(object.metadata.annotations) || object.metadata.annotations.all(k, !k.startsWith('io.katacontainers.') && k != 'k8s.v1.cni.cncf.io/networks' && !(k in ['cni.projectcalico.org/ipAddrs', 'cni.projectcalico.org/ipAddrsNoIpam', 'cni.projectcalico.org/ipv4pools', 'cni.projectcalico.org/ipv6pools', 'cni.projectcalico.org/floatingIPs', 'cni.projectcalico.org/allowSpoofedSourcePrefixes']))"
      message: Workloads cannot override the hypervisor or attach extra networks.
    - expression: "!has(object.spec.resourceClaims) || size(object.spec.resourceClaims) == 0"
      message: Direct device claims require a separate administrator-reviewed runtime.
    - expression: "variables.containers.all(c, !has(c.resources) || !has(c.resources.limits) || c.resources.limits.all(k, !k.contains('/')))"
      message: Direct device allocations are forbidden.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: require-kata-isolation
spec:
  policyName: require-kata-isolation
  validationActions: [Deny]
