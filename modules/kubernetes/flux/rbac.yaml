apiVersion: v1
kind: Namespace
metadata:
  name: platform-services
  labels:
    homelab/owner: nix
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  labels:
    homelab/owner: nix
  namespace: platform-services
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  labels:
    homelab/owner: nix
  namespace: flux-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-orchestrator
  labels:
    homelab/owner: nix
  namespace: flux-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-apps
  labels:
    homelab/owner: nix
  namespace: flux-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-infrastructure
  labels:
    homelab/owner: nix
  namespace: flux-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-controller
  labels:
    homelab/owner: nix
  namespace: flux-system
rules:
- apiGroups: [source.toolkit.fluxcd.io]
  resources: [gitrepositories, gitrepositories/status, helmrepositories, helmrepositories/status, helmcharts,
    helmcharts/status, ocirepositories, ocirepositories/status, buckets, buckets/status]
  verbs: &id001 [get, list, watch, create, update, patch, delete]
- apiGroups: [kustomize.toolkit.fluxcd.io]
  resources: [kustomizations, kustomizations/status]
  verbs: *id001
- apiGroups: [helm.toolkit.fluxcd.io]
  resources: [helmreleases, helmreleases/status]
  verbs: *id001
- apiGroups: ['']
  resources: [secrets, serviceaccounts]
  verbs: [get, list, watch]
- apiGroups: ['']
  resources: [configmaps, configmaps/status]
  verbs: *id001
- apiGroups: ['']
  resources: [events]
  verbs: [create, patch]
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: *id001
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-controller
  labels:
    homelab/owner: nix
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-controller
subjects:
- kind: ServiceAccount
  name: source-controller
  namespace: flux-system
- kind: ServiceAccount
  name: kustomize-controller
  namespace: flux-system
- kind: ServiceAccount
  name: helm-controller
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-impersonation
  labels:
    homelab/owner: nix
  namespace: flux-system
rules:
- apiGroups: ['']
  resources: [serviceaccounts]
  resourceNames: [flux-orchestrator, flux-apps, flux-infrastructure]
  verbs: [impersonate]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-impersonation
  labels:
    homelab/owner: nix
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-impersonation
subjects:
- kind: ServiceAccount
  name: kustomize-controller
  namespace: flux-system
- kind: ServiceAccount
  name: helm-controller
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-orchestrator
  labels:
    homelab/owner: nix
  namespace: flux-system
rules:
- apiGroups: [kustomize.toolkit.fluxcd.io]
  resources: [kustomizations]
  verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-orchestrator
  labels:
    homelab/owner: nix
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-orchestrator
subjects:
- kind: ServiceAccount
  name: flux-orchestrator
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-chart-definitions
  labels:
    homelab/owner: nix
  namespace: flux-system
rules:
- apiGroups: [source.toolkit.fluxcd.io]
  resources: [helmrepositories, ocirepositories]
  verbs: &id001 [get, list, watch, create, update, patch, delete]
- apiGroups: [helm.toolkit.fluxcd.io]
  resources: [helmreleases]
  verbs: *id001
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-chart-definitions
  labels:
    homelab/owner: nix
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-chart-definitions
subjects:
- kind: ServiceAccount
  name: flux-infrastructure
  namespace: flux-system
- kind: ServiceAccount
  name: flux-apps
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-workloads
  labels:
    homelab/owner: nix
  namespace: applications
rules:
- apiGroups: ['']
  resources: [pods, services, configmaps, secrets, persistentvolumeclaims]
  verbs: &id001 [get, list, watch, create, update, patch, delete]
- apiGroups: ['']
  resources: [events]
  verbs: [get, list, watch]
- apiGroups: [apps]
  resources: [deployments, replicasets, statefulsets, daemonsets]
  verbs: *id001
- apiGroups: [batch]
  resources: [jobs, cronjobs]
  verbs: *id001
- apiGroups: [autoscaling]
  resources: [horizontalpodautoscalers]
  verbs: *id001
- apiGroups: [policy]
  resources: [poddisruptionbudgets]
  verbs: *id001
- apiGroups: [networking.k8s.io]
  resources: [ingresses]
  verbs: *id001
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-workloads
  labels:
    homelab/owner: nix
  namespace: applications
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-workloads
subjects:
- kind: ServiceAccount
  name: flux-apps
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-workloads
  labels:
    homelab/owner: nix
  namespace: platform-services
rules:
- apiGroups: ['']
  resources: [pods, services, configmaps, secrets, persistentvolumeclaims]
  verbs: &id001 [get, list, watch, create, update, patch, delete]
- apiGroups: ['']
  resources: [events]
  verbs: [get, list, watch]
- apiGroups: [apps]
  resources: [deployments, replicasets, statefulsets, daemonsets]
  verbs: *id001
- apiGroups: [batch]
  resources: [jobs, cronjobs]
  verbs: *id001
- apiGroups: [autoscaling]
  resources: [horizontalpodautoscalers]
  verbs: *id001
- apiGroups: [policy]
  resources: [poddisruptionbudgets]
  verbs: *id001
- apiGroups: [networking.k8s.io]
  resources: [ingresses]
  verbs: *id001
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-workloads
  labels:
    homelab/owner: nix
  namespace: platform-services
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-workloads
subjects:
- kind: ServiceAccount
  name: flux-infrastructure
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flux-api-health
  labels:
    homelab/owner: nix
rules:
- nonResourceURLs: [/livez/ping]
  verbs: [head]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-api-health
  labels:
    homelab/owner: nix
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flux-api-health
subjects:
- kind: ServiceAccount
  name: source-controller
  namespace: flux-system
- kind: ServiceAccount
  name: kustomize-controller
  namespace: flux-system
- kind: ServiceAccount
  name: helm-controller
  namespace: flux-system
