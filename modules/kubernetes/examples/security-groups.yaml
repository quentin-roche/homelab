# Optional example; not installed automatically. Namespace labels belong to
# administrators. Application users must not be allowed to change namespaces.
apiVersion: v1
kind: Namespace
metadata:
  name: frontend
  labels:
    security.homelab/group: frontend
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
---
apiVersion: v1
kind: Namespace
metadata:
  name: database
  labels:
    security.homelab/group: database
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: frontend
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: database
automountServiceAccountToken: false
---
apiVersion: crd.projectcalico.org/v1
kind: GlobalNetworkPolicy
metadata:
  name: frontend-to-database
spec:
  order: 100
  selector: all()
  namespaceSelector: "security.homelab/group == 'frontend'"
  types: [Egress]
  egress:
    - action: Allow
      protocol: TCP
      destination:
        namespaceSelector: "security.homelab/group == 'database'"
        ports: [5432]
---
apiVersion: crd.projectcalico.org/v1
kind: GlobalNetworkPolicy
metadata:
  name: database-from-frontend
spec:
  order: 100
  selector: all()
  namespaceSelector: "security.homelab/group == 'database'"
  types: [Ingress]
  ingress:
    - action: Allow
      protocol: TCP
      source:
        namespaceSelector: "security.homelab/group == 'frontend'"
      destination:
        ports: [5432]
