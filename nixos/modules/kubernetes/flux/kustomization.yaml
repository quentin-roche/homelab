apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - upstream.yaml
labels:
  - pairs:
      homelab/owner: nix
patches:
  # Keep only source, kustomize and helm. Scoped RBAC/Calico rules live beside this overlay.
  - target:
      labelSelector: app.kubernetes.io/component in (notification-controller,image-reflector-controller,image-automation-controller,source-watcher)
    patch: |
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: unused
  - target:
      kind: ClusterRole
    patch: |
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: unused
  - target:
      kind: ClusterRoleBinding
    patch: |
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: unused
  - target:
      kind: NetworkPolicy
    patch: |
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: unused
  - target:
      kind: ResourceQuota
    patch: |
      $patch: delete
      apiVersion: v1
      kind: ResourceQuota
      metadata:
        name: unused
  - target:
      kind: Namespace
      name: flux-system
    patch: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: flux-system
        labels:
          pod-security.kubernetes.io/enforce: restricted
          pod-security.kubernetes.io/enforce-version: v1.35
          pod-security.kubernetes.io/audit: restricted
          pod-security.kubernetes.io/warn: restricted
  - target:
      kind: Deployment
      name: (source-controller|kustomize-controller|helm-controller)
    patch: |
      - op: remove
        path: /spec/template/spec/priorityClassName
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: kata-qemu
      - op: add
        path: /spec/template/spec/automountServiceAccountToken
        value: true
      - op: add
        path: /spec/template/spec/securityContext/runAsUser
        value: 65534
      - op: add
        path: /spec/template/spec/securityContext/runAsNonRoot
        value: true
      - op: add
        path: /spec/template/spec/securityContext/seccompProfile
        value: {type: RuntimeDefault}
  - path: source.yaml
  - path: reconcilers.yaml
