apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-certificates
  namespace: applications
  labels:
    homelab/owner: nix
rules:
  - apiGroups: [cert-manager.io]
    resources: [certificates, issuers]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-certificates
  namespace: platform-services
  labels:
    homelab/owner: nix
rules:
  - apiGroups: [cert-manager.io]
    resources: [certificates, issuers]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-certificates
  namespace: applications
  labels:
    homelab/owner: nix
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-certificates
subjects:
  - kind: ServiceAccount
    name: flux-reconciler
    namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-certificates
  namespace: platform-services
  labels:
    homelab/owner: nix
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-certificates
subjects:
  - kind: ServiceAccount
    name: flux-reconciler
    namespace: flux-system
