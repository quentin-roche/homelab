apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
  interval: 5m
  retryInterval: 30s
  sourceRef:
    kind: GitRepository
    name: homelab
  path: ./kubernetes/clusters/chopin/apps
  targetNamespace: applications
  serviceAccountName: flux-apps
  prune: true
  deletionPolicy: Orphan
  wait: true
  timeout: 10m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
