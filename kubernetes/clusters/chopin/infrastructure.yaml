apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 30s
  sourceRef:
    kind: GitRepository
    name: homelab
  path: ./kubernetes/clusters/chopin/infrastructure
  serviceAccountName: flux-infrastructure
  prune: true
  deletionPolicy: Orphan
  wait: true
  timeout: 10m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
