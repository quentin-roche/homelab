apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 1h
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 15m
  timeout: 10m
  releaseName: traefik
  serviceAccountName: flux-reconciler
  targetNamespace: platform-services
  storageNamespace: platform-services
  chart:
    spec:
      chart: traefik
      version: 41.6.1
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 1h
  install:
    createNamespace: false
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    remediation:
      retries: 3
  values:
    deployment:
      runtimeClassName: kata-qemu
      podLabels:
        homelab/controller: traefik
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: '1'
        memory: 512Mi
    providers:
      kubernetesCRD:
        enabled: false
      kubernetesIngress:
        enabled: true
        ingressClass: traefik
        namespaces:
        - applications
        - platform-services
        publishedService:
          enabled: false
    ingressClass:
      enabled: true
      isDefaultClass: false
      name: traefik
    service:
      type: NodePort
      spec:
        externalTrafficPolicy: Local
    ports:
      web:
        nodePort: 30080
      websecure:
        nodePort: 30443
    metrics:
      prometheus:
        enabled: false
    log:
      format: json
    accessLog:
      enabled: true
      format: json
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: ServiceAccount
        patch: "$patch: delete\napiVersion: v1\nkind: ServiceAccount\nmetadata:\n\
          \  name: unused\n"
      - target:
          kind: Role
        patch: "$patch: delete\napiVersion: rbac.authorization.k8s.io/v1\nkind: Role\n\
          metadata:\n  name: unused\n"
      - target:
          kind: RoleBinding
        patch: "$patch: delete\napiVersion: rbac.authorization.k8s.io/v1\nkind: RoleBinding\n\
          metadata:\n  name: unused\n"
      - target:
          kind: ClusterRole
        patch: "$patch: delete\napiVersion: rbac.authorization.k8s.io/v1\nkind: ClusterRole\n\
          metadata:\n  name: unused\n"
      - target:
          kind: ClusterRoleBinding
        patch: "$patch: delete\napiVersion: rbac.authorization.k8s.io/v1\nkind: ClusterRoleBinding\n\
          metadata:\n  name: unused\n"
      - target:
          kind: IngressClass
        patch: "$patch: delete\napiVersion: networking.k8s.io/v1\nkind: IngressClass\n\
          metadata:\n  name: unused\n"
      - target:
          kind: MutatingWebhookConfiguration
        patch: "$patch: delete\napiVersion: admissionregistration.k8s.io/v1\nkind:\
          \ MutatingWebhookConfiguration\nmetadata:\n  name: unused\n"
      - target:
          kind: ValidatingWebhookConfiguration
        patch: "$patch: delete\napiVersion: admissionregistration.k8s.io/v1\nkind:\
          \ ValidatingWebhookConfiguration\nmetadata:\n  name: unused\n"
      - target:
          kind: Deployment
          name: traefik
        patch: "- op: remove\n  path: /spec/template/spec/containers/0/lifecycle\n"
